<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Pagina Tecnologica!</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("imagens/images.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
    
            text-align: center;
            color: white;
            padding-top: 50px;
        }

        .texto-centro {
        
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 22px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 50px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Bem-vindo a Moticação Tecnologica</h1>

    <div class="texto-centro">
        <p>
            A tecnologia vem nos desafiando ao longo dos anos te convido a encarar essa 
            nova aventura, você é meu convidado especial gafanhoto.
        </p>
    </div>

    <div class="texto-lateral">
        <p>
            Vou encarar esse desafio.
        </p>
    </div>

</body>

</html>
